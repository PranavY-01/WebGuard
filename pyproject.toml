[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "webguard"
version = "1.0.0"
description = "Passive, single-target web security configuration auditor (TLS, security headers, cookies, redirects)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pranav" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Environment :: Console",
]
dependencies = [
    "httpcore>=1.0.9,<2",
    "h11>=0.16,<1",
    "certifi>=2025.1.31",
    "idna>=3.10,<4",
    "pydantic>=2.11,<3",
    "typer>=0.16,<1",
    "rich>=14,<16",
    "jinja2>=3.1.6,<4",
]

[project.urls]
Repository = "https://github.com/PranavY-01/WebGuard"

[project.scripts]
webguard = "webguard.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "trustme>=1.2",
    "cryptography>=45",
    "import-linter>=2.3",
    "ruff>=0.12",
    "mypy>=1.17",
    "pip-audit>=2.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/webguard"]

[tool.uv]
# Never pick a release younger than two weeks (supply-chain cooling-off).
exclude-newer = "2026-10-13T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "PT"]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts are the point; fixtures bind loopback and use throwaway subprocesses.
"tests/**" = ["S101", "S104", "S603", "S311", "S108"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: tests that wait on real timeouts (seconds)"]
